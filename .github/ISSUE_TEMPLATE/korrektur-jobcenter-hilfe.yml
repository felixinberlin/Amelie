name: "Korrektur: Gründungsnavigator / Jobcenter-Hilfe"
description: "Fehler, falsche Auskunft oder fehlende Sicht der Praxis melden. Besonders willkommen: Fachleute aus Jobcenter, Sozialberatung und Anwaltschaft."
title: "[Korrektur] "
labels: ["korrektur", "gruendungsnavigator"]
body:
  - type: markdown
    attributes:
      value: |
        Danke, dass Sie sich die Zeit nehmen. Jede Korrektur wird geprüft und, wenn sie zutrifft, mit Datum in die Prüfakte übernommen.
        **Bitte keine persönlichen Daten** (Namen, BG-Nummern, Bescheide mit Anschrift). Für Ihren eigenen Fall wenden Sie sich bitte an eine Sozialberatung; hier gibt es keine Rechtsberatung.
  - type: dropdown
    id: seite
    attributes:
      label: Welche Seite?
      options:
        - Jobcenter-Hilfe (Meldeversäumnis, Rückforderung, Miete, Fristen, Vermögen, Briefe)
        - Gesprächsnavigator (Gründung)
        - Fall-Landkarte
        - Branchenpaket
        - Andere
    validations:
      required: true
  - type: textarea
    id: stelle
    attributes:
      label: Wo steht es? (Abschnitt, Frage, Karte oder wörtlicher Satz)
    validations:
      required: true
  - type: textarea
    id: richtig
    attributes:
      label: Was ist falsch oder fehlt, und wie wäre es richtig?
    validations:
      required: true
  - type: textarea
    id: beleg
    attributes:
      label: Beleg (Norm, Fachliche Weisung mit Randziffer, Arbeitshilfe, Urteil mit Datum)
      description: Hilft beim Prüfen. Wenn es Erfahrung aus der Praxis ist, schreiben Sie das einfach so.
  - type: dropdown
    id: rolle
    attributes:
      label: Aus welcher Sicht schreiben Sie? (freiwillig)
      options:
        - Jobcenter / Bundesagentur
        - Sozialberatung / Erwerbslosenhilfe
        - Anwaltschaft / Gericht
        - Betroffen
        - Andere / keine Angabe
