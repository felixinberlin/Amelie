name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys laufen nacheinander statt sich gegenseitig abzuschießen.
# cancel-in-progress: true hat bei zwei Pushes kurz hintereinander den
# ersten Lauf mitten im Deploy abgebrochen (22.09.2026).
#
# Bleibt die Seite nach einem Push kurz weiß: Das ist der HTML-Cache,
# nicht dieser Workflow. GitHub Pages lässt index.html bis zu zehn
# Minuten cachen, die Asset-Dateinamen ändern sich aber mit jedem Build
# (assets/index-<hash>.js). In dem Fenster zeigt eine gecachte
# index.html auf einen Hash, den es nicht mehr gibt → 404 → leeres
# #root. Cache-Control lässt sich bei GitHub Pages nicht setzen;
# hartes Neuladen hilft sofort, von allein heilt es nach Ablauf.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build with GitHub Pages base
        run: |
          npm run build
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
        env:
          # Optional: enables the Google Workspace import (public client-side values)
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
