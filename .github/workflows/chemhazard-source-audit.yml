name: ChemHazard source audit
on:
  pull_request:
    paths:
      - '07-demos/chemhazard-stop/data/source-audit-manifest.json'
      - 'scripts/chemhazard-source-audit.mjs'
      - '.github/workflows/chemhazard-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: node scripts/chemhazard-source-audit.mjs "$RUNNER_TEMP/chemhazard-review.json"
      - uses: actions/upload-artifact@v4
        with:
          name: chemhazard-source-review
          path: ${{ runner.temp }}/chemhazard-review.json
